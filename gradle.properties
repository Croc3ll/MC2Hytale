org.gradle.daemon = true
org.gradle.jvmargs = -Xmx2G
org.gradle.parallel = true
org.gradle.caching = true

java_version = 25
hytale_version = 0.+

group = com.mc2hytale
manifest_group = MC2Hytale
mod_name = MC2Hytale
main_class = com.mc2hytale.MC2HytalePlugin
mod_author = Croc3ll
mod_id = MC2Hytale
