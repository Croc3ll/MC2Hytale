mod_description = Converts Minecraft schematics (.schem, .schematic, .nbt) into Hytale prefabs with block listing and replacement rules.
mod_url = https://github.com/Croc3ll/MC2Hytale
version = 0.1.0

includes_pack = false
disabled_by_default = false
patchline = release
server_version = 0.7.2
manifestServerVersion = >=0.7.2 <0.8.0
manifest_dependencies = Hytale:AssetModule=*
manifest_opt_dependencies = 
curseforgeID = 
injectServerJavadocsIntoSources = false
generateAssetsBinary = false
hytaleHomeOverride = /path/to/Hytale/Assets.zip
